simulation:
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 2
  seed: 1

environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openrouter-claude-haiku-5-5
    llm:
      provider: together
      together:
        base_url: https://openrouter.ai/api/v1
        model: anthropic/claude-haiku-5.5
        request_timeout: 120
        params:
          max_tokens: 1000
          temperature: 0.7

experiment:
  tag: quickstart_claude
  output_dir: experiments/collusion/outputs/quickstart_claude
  max_concurrent_runs: 3
  seeds: [1]
  collusion:
    colluder_selection: random
    agent_order: random
  sweeps:
    - name: quickstart
      topologies: [complete]
      num_agents: [4]
      colluder_counts: [2]
      secret_channel_enabled: [false, true]
      prompt_variants: [control, simple]